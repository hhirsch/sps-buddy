# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go
on:
  push:
    branches: [ "main" ]
    tags:
      - '*'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '^1.22'
    - name: Linux Build
      run: go build ./
    - name: Windows Build
      run: GOOS=windows GOARCH=amd64 go build ./  
    - name: Running Tests
      run: go test ./
    - name: Compress Linux Binary
      run: tar -czvf sps-buddy_linux_x86_64.tar.gz sps-buddy
    - name: Compress Windows Binary
      run: tar -czvf sps-buddy_windows_x86_64.tar.gz sps-buddy.exe
    - name: Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
            sps-buddy_linux_x86_64.tar.gz
            sps-buddy_windows_x86_64.tar.gz 
            sps-buddy